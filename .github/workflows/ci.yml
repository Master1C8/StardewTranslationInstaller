name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical-audit:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit package structure and JSON
        run: node Scripts/audit-release-structure.mjs

      - name: Verify compressed XNB assets
        run: ./Scripts/compress-xnb-fonts.swift --verify

      - name: Verify generated Content Patcher root
        run: |
          node Scripts/generate-unified-content.mjs
          git diff --exit-code -- Sources/StardewTranslationInstaller/Resources/ModPayload/content.json

      - name: Check release shell scripts
        run: bash -n Scripts/audit-locale-data.sh Scripts/release-audit.sh Scripts/run-hebrew-rtl-probe.sh Scripts/run-language-switcher-probe.sh

      - name: Run installer tests
        run: swift test --disable-sandbox
